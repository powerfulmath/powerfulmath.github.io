<!DOCTYPE html>
<html>
<head>
</head>
<body>
<div id="content"></div>
<script>
  fetch("content.html")
    .then(response => {
      if (!response.ok) throw new Error("Could not load HTML");
      return response.text();
    })
    .then(html => {
      document.querySelector("#content").innerHTML = html;
    })
    .catch(console.error);
</script>
</body>
</html>
